name: Microservices CI

on:
  push:
    branches: [main]
    # Đẩy tag v* (vd. v1.1.0) -> chạy test rồi job release-apk build APK ký sẵn và đưa lên GitHub Release.
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'core-backend/pom.xml'

      - name: Run backend tests
        run: cd core-backend && mvn -B clean test -Dtest=!CoreBackendApplicationTests

  mobile-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run mobile checks
        run: cd mobile-app && flutter pub get && flutter analyze && flutter test

  ai-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Run AI service tests
        run: cd ai-service && pip install -r requirements-dev.txt && pytest test_*.py -v
  # Deploy không cần mở cổng 22: GitHub OIDC đổi lấy quyền tạm của IAM role (chỉ repo này, nhánh main), rồi gửi lệnh
  # qua SSM Run Command tới SSM agent trên EC2. Không có khóa SSH hay access key nào trong GitHub.
  # Cần Variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, AWS_INSTANCE_ID (và DEPLOY_USER nếu khác ubuntu). Xem DEPLOY_GUIDE mục 14.
  deploy:
    name: Deploy to AWS EC2 (SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [backend-ci, mobile-ci, ai-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # để configure-aws-credentials xin OIDC token
    # Hai lần push liền nhau: lần deploy sau đợi lần trước xong, không chạy chồng lên nhau trên cùng server.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      # Build core-api (Maven) và data-mining-api (torch) trên máy 2 vCPU có thể mất hơn 20 phút.
      EXECUTION_TIMEOUT_SECONDS: '2400'
      # SSM agent offline (máy đang Stop) thì lệnh hết hạn sau 10 phút thay vì treo cả job.
      DELIVERY_TIMEOUT_SECONDS: '600'
      POLL_INTERVAL_SECONDS: '20'
    steps:
      - name: Check deploy variables
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION AWS_INSTANCE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Thiếu variable $name (xem docs/deploy/DEPLOY_GUIDE.md mục 14)"; missing=1; fi
          done
          exit $missing

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ledgermind-deploy-${{ github.run_id }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          app_dir="/home/${DEPLOY_USER}/Deploy_Project"

          # Đồng bộ đúng commit vừa qua test (không lấy origin/main mới hơn). git chạy bằng user thường để dùng deploy
          # key của user đó; .env và model bị ignore nên reset --hard không đụng tới. Migration SQL KHÔNG tự chạy.
          jq -n --arg dir "$app_dir" --arg user "$DEPLOY_USER" --arg sha "$GITHUB_SHA" --arg timeout "$EXECUTION_TIMEOUT_SECONDS" '{
            commands: [
              "set -eu",
              "cd \($dir)",
              "sudo -H -u \($user) git fetch origin main",
              "sudo -H -u \($user) git checkout -f main",
              "sudo -H -u \($user) git reset --hard \($sha)",
              "bash scripts/deploy/server-deploy.sh \($dir)"
            ],
            executionTimeout: [$timeout]
          }' > ssm-params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}" \
            --timeout-seconds "$DELIVERY_TIMEOUT_SECONDS" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          status=Pending
          while :; do
            sleep "$POLL_INTERVAL_SECONDS"
            # Ngay sau send-command, invocation có thể chưa tồn tại: coi như Pending.
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) echo "$(date -u +%T) $status" ;;
              *) break ;;
            esac
          done

          echo "::group::Output trên server ($status)"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          if [ "$status" != Success ]; then
            echo "::error::Deploy SSM kết thúc với trạng thái $status"
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

  # Chỉ chạy khi đẩy tag v*: build APK release ký bằng keystore trong GitHub Secrets và đưa lên GitHub Release với tên
  # cố định LedgerMind.apk, để link .../releases/latest/download/LedgerMind.apk (nút tải + QR ở index.html) luôn trỏ
  # tới bản mới nhất. Cần: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
  # ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON_BASE64 và variable APP_API_BASE (vd. https://api.example.com).
  release-apk:
    name: Build & release signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mobile-ci]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          APP_API_BASE: ${{ vars.APP_API_BASE }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64 APP_API_BASE; do
            if [ -z "${!name}" ]; then echo "::error::Thiếu $name (xem docs/deploy/DEPLOY_GUIDE.md)"; missing=1; fi
          done
          case "$APP_API_BASE" in https://*) ;; *) echo "::error::APP_API_BASE phải bắt đầu bằng https://"; missing=1;; esac
          exit $missing

      - name: Restore keystore and google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile-app/android/app/google-services.json

      - name: Build signed release APK
        env:
          # Đọc bởi mobile-app/android/app/build.gradle.kts khi không có android/key.properties.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_API_BASE: ${{ vars.APP_API_BASE }}
        run: |
          # Tên phiên bản lấy từ tag (v1.1.0 -> 1.1.0), versionCode tăng theo số lần chạy: không sửa pubspec.yaml.
          # API_BASE / ML_BASE là hai khóa mà mobile-app/lib/config/app_config.dart đọc bằng String.fromEnvironment.
          API_BASE="${APP_API_BASE%/}"
          cd mobile-app
          flutter pub get
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE="$API_BASE" \
            --dart-define=ML_BASE="$API_BASE/ai"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/LedgerMind.apk"

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" mobile-app/android/app/google-services.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LedgerMind.apk
          generate_release_notes: true
          make_latest: 'true'
