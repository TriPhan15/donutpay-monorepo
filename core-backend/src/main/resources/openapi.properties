# OpenAPI / Swagger UI (springdoc). Loaded by Config/OpenApiConfig with the LOWEST precedence: environment variables
# and application.yml override every line. Outside the "dev" profile openapi-disabled.properties turns both endpoints off.

# Swagger UI at /swagger-ui.html, the JSON at /v3/api-docs/{group} (groups "user" and "admin", see OpenApiConfig).
# Only /api/** is documented: the Thymeleaf admin pages (/admin/**) and the mock gateway belong to no group.
springdoc.swagger-ui.path=/swagger-ui.html
# The JWT entered with "Authorize" survives a page reload.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
