# Loaded by OpenApiConfig.DisabledOutsideDev, i.e. whenever the "dev" profile is NOT active (prod, tests, no profile):
# /v3/api-docs and /swagger-ui.html do not exist, so the API description is never public on the VPS.
# A deliberate exception is still possible through the environment (SPRINGDOC_API_DOCS_ENABLED=true and
# SPRINGDOC_SWAGGER_UI_ENABLED=true), which overrides this file.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
