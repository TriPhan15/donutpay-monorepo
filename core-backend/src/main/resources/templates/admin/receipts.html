<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Hóa đơn AI</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .swal2-popup.swal2-toast { padding: 10px 15px !important; }
        table.dataTable { width: 100% !important; margin-top: 15px !important; font-size: 19px; }
        .table > :not(caption) > * > * { padding: 12px 16px !important; vertical-align: middle; }
    </style>
</head>
<body>
<div th:replace="~{admin/layout/_layout :: main('Quản lý Hóa đơn AI', ~{:: #main-content})}">
    <div id="main-content">

        <div class="card shadow-sm border-0 border-top border-4 border-danger">
            <div class="card-header bg-white border-bottom pt-3 pb-2">
                <h5 class="card-title text-success fw-bold mb-0">
                    <i class="bi bi-robot me-2"></i>Danh sách Hóa Đơn AI
                </h5>
                <p class="text-muted small mb-0 mt-1">Danh sách toàn bộ hóa đơn được hệ thống AI quét và bóc tách</p>
            </div>
            <div class="card-body p-4"> <div class="table-responsive">
                <table id="receiptsTable" class="table table-hover table-striped align-middle border w-100 mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="text-center" style="width: 10%;">ID</th>
                        <th>Tên Cửa hàng</th>
                        <th class="text-end" style="width: 20%;">Tiền AI đọc</th>
                        <th class="text-center" style="width: 15%;">Ảnh gốc</th>
                        <th class="text-center" style="width: 15%;">Trạng thái</th>
                        <th class="text-center" style="width: 20%;">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="receipt : ${receipts}"
                        th:with="canApprove=${receipt.canMoveTo(T(vn.edu.huit.finance.core.Entity.ReceiptStatus).APPROVED) and !T(vn.edu.huit.finance.core.Entity.ReceiptStatus).APPROVED.matches(receipt.status)},
                                 canReject=${receipt.canMoveTo(T(vn.edu.huit.finance.core.Entity.ReceiptStatus).FAILED) and !T(vn.edu.huit.finance.core.Entity.ReceiptStatus).FAILED.matches(receipt.status)}">
                        <td class="text-center fw-bold text-muted" th:text="${'#' + receipt.id}"></td>
                        <td class="fw-bold text-primary" th:text="${receipt.vendorName}"></td>
                        <td class="text-end fw-bold text-danger fs-6" th:text="${#numbers.formatInteger(receipt.extractedTotal, 1, 'POINT') + ' VNĐ'}"></td>
                        <td class="text-center">
                            <a th:if="${receipt.imageUrl != null and (#strings.startsWith(#strings.toLowerCase(receipt.imageUrl), 'https://') or #strings.startsWith(#strings.toLowerCase(receipt.imageUrl), 'http://'))}" th:href="${receipt.imageUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-info rounded-pill px-3 fw-bold">
                                <i class="bi bi-image me-1"></i> Xem ảnh
                            </a>
                            <span th:unless="${receipt.imageUrl != null and (#strings.startsWith(#strings.toLowerCase(receipt.imageUrl), 'https://') or #strings.startsWith(#strings.toLowerCase(receipt.imageUrl), 'http://'))}" class="text-muted small badge bg-light text-dark">Chưa có ảnh</span>
                        </td>
                        <td class="text-center">
                            <span th:if="${receipt.legacyStatus == 'SUCCESS'}" class="badge bg-success rounded-pill px-3 py-2 w-100">Thành công</span>
                            <span th:if="${receipt.legacyStatus == 'FAILED'}" class="badge bg-danger rounded-pill px-3 py-2 w-100">Lỗi AI</span>
                            <span th:if="${receipt.legacyStatus != 'SUCCESS' and receipt.legacyStatus != 'FAILED'}" class="badge bg-warning text-dark rounded-pill px-3 py-2 w-100">Đang xử lý</span>
                        </td>
                        <td class="text-center">
                            <!-- POST thường tới AdminController (trả về redirect:/admin/receipts); th:action tự thêm _csrf nếu CSRF được bật. -->
                            <form th:if="${canApprove}" method="post" class="d-inline receipt-review-form"
                                  th:action="@{/admin/receipts/approve/{id}(id=${receipt.id})}" data-review-action="Duyệt">
                                <button type="submit" class="btn btn-sm btn-success fw-bold px-3 rounded-pill me-1">
                                    <i class="bi bi-check-circle"></i> Duyệt
                                </button>
                            </form>
                            <form th:if="${canReject}" method="post" class="d-inline receipt-review-form"
                                  th:action="@{/admin/receipts/reject/{id}(id=${receipt.id})}" data-review-action="Từ chối">
                                <button type="submit" class="btn btn-sm btn-outline-danger fw-bold px-3 rounded-pill">
                                    <i class="bi bi-x-circle"></i> Từ chối
                                </button>
                            </form>
                            <span th:unless="${canApprove or canReject}" class="text-muted small">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{admin/layout/_pagination :: bar(${receiptsPage}, '/admin/receipts', 'receiptPage', ${pageSize})}"></div>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    // Hỏi lại trước khi gửi form Duyệt / Từ chối (thao tác có ghi nhật ký và có thể thay đổi số dư ví của người dùng).
    document.addEventListener('submit', function (event) {
        const form = event.target;
        if (!form.classList.contains('receipt-review-form') || form.dataset.confirmed === 'true') return;
        event.preventDefault();
        const action = form.dataset.reviewAction;
        Swal.fire({
            title: `Xác nhận ${action} hóa đơn?`,
            text: action === 'Duyệt'
                ? 'Số tiền giao dịch sẽ được cập nhật theo tổng tiền của hóa đơn và số dư ví được điều chỉnh tương ứng.'
                : 'Hóa đơn sẽ chuyển sang trạng thái lỗi (bị quản trị viên từ chối).',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: action === 'Duyệt' ? '#198754' : '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: `Vâng, ${action}!`,
            cancelButtonText: 'Hủy'
        }).then((result) => {
            if (result.isConfirmed) {
                form.dataset.confirmed = 'true';
                form.submit();
            }
        });
    });

    window.addEventListener('load', function() {
        function loadJS(url, callback) {
            var script = document.createElement('script');
            script.src = url;
            script.onload = callback;
            document.body.appendChild(script);
        }

        function initDataTables() {
            $('#receiptsTable').DataTable({
                // Phân trang do server làm (thanh phân trang ở trên); DataTables chỉ sắp xếp trong trang đang xem.
                "paging": false,
                "info": false,
                "searching": false,
                "order": [ [0, "desc"] ],
                "columnDefs": [ { "orderable": false, "targets": [3, 5] } ],
                "language": { "url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/vi.json" }
            });
        }

        if (window.jQuery) {
            loadJS("https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js", function() {
                loadJS("https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js", initDataTables);
            });
        } else {
            loadJS("https://code.jquery.com/jquery-3.7.1.min.js", function() {
                loadJS("https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js", function() {
                    loadJS("https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js", initDataTables);
                });
            });
        }
    });
</script>
</body>
</html>
