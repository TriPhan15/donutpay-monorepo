# Cấu hình chỉ đọc biến môi trường. KHÔNG ghi secret thật vào file này: mọi secret mặc định rỗng và được điền bằng .env
# (xem .env.example). Profile mặc định là prod (Dockerfile + docker-compose); prod thiếu secret sẽ không khởi động được
# (Config/ProductionSecretsGuard).
server:
  port: 8080
  address: 0.0.0.0
spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/finance_nosql}
  application:
    name: core-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

postgres:
  bin:
    path: ${POSTGRES_BIN_PATH:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:357487248201-up4rikcc0d65r2mbdihs81192obh2jvd.apps.googleusercontent.com}
  facebook:
    app-id: ${FACEBOOK_APP_ID:1631447635348542}

payment:
  secret: ${PAYMENT_SECRET:}
  mock-gateway:
    enabled: ${MOCK_GATEWAY_ENABLED:true}
  mock-gateway-url: ${MOCK_GATEWAY_URL:http://localhost:8080/mock-gateway}
  webhook-url: ${PAYMENT_WEBHOOK_URL:http://localhost:8080/api/payment/webhook}
  vnpay:
    secret: ${VNPAY_SECRET:}
  zalopay:
    secret: ${ZALOPAY_SECRET:}
