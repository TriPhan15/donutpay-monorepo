# Phân tích chất lượng OCR trong MongoDB. Nạp bởi Config/AsyncConfig với độ ưu tiên THẤP NHẤT: biến môi trường và
# application.yml ghi đè dòng này.

# Phiên bản mô hình OCR đang chạy, ghi vào ocr_logs và ocr_feedbacks để so sánh các mô hình với nhau.
app.ocr.model-version=${OCR_MODEL_VERSION:donut-v5}

# Sao lưu PostgreSQL tự động hằng ngày (Service/Backup/ScheduledBackupJob). Cùng quy tắc ưu tiên: biến môi trường và
# application.yml ghi đè dòng này. Không có bí mật nào ở đây.
# Công tắc: false thì lịch không chạy, nút sao lưu tay trên trang Sao lưu vẫn dùng được.
app.backup.enabled=${BACKUP_SCHEDULE_ENABLED:true}
# Cron 6 trường của Spring (giây phút giờ ngày tháng thứ): mặc định 02:00 mỗi ngày.
app.backup.cron=${BACKUP_SCHEDULE_CRON:0 0 2 * * *}
# Múi giờ của cron.
app.backup.zone=${BACKUP_SCHEDULE_ZONE:Asia/Ho_Chi_Minh}
