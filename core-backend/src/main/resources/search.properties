# Full-text search of the user's transactions. Loaded by Config/SearchConfig with the LOWEST precedence: environment
# variables and application.yml override every line. No secret belongs here: the password only ever comes from
# ELASTIC_PASSWORD. Elasticsearch only holds a copy of PostgreSQL that can be rebuilt (POST /api/admin/search/reindex).

# elasticsearch: the index is kept in step after every commit and searched; postgres (the default): no Elasticsearch at all.
app.search.engine=${SEARCH_ENGINE:postgres}

# Connection. Inside docker-compose the host is the "elasticsearch" service. Creating the client connects to nothing:
# the first request does, so with the engine set to postgres no connection is ever attempted.
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTIC_USERNAME:elastic}
spring.elasticsearch.password=${ELASTIC_PASSWORD:}
# The most a slow or unreachable Elasticsearch can hold a call before it fails.
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.socket-timeout=2s
# No Spring Data Elasticsearch repositories, and an Elasticsearch outage does not turn the API's health DOWN.
spring.data.elasticsearch.repositories.enabled=false
management.health.elasticsearch.enabled=false
